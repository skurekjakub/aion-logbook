# Syncs the character from the official site's public data and commits the snapshot and the database export
# when they changed (spec § 8).
#
# Manual trigger only. A daily `schedule:` is waiting on the user's decision: the official character data is
# not a published interface, and NCSOFT's Terms of Use § 6 forbid automated access outside published ones
# (OPEN-QUESTIONS.md § Character sync, research/002-character-data-source).
name: sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restores the database from data/snapshot.json, writes the day's snapshot, imports and exports it;
      # --no-push leaves the commit to the next step.
      - run: pnpm sync --no-push

      - name: Commit and push when changed
        run: |
          git add account data/snapshot.json
          if git diff --cached --quiet; then
            echo "unchanged: nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > "$RUNNER_TEMP/commit-message.txt" <<'EOF'
          chore(account): sync the character

          Run by .github/workflows/sync.yml from the official site's public
          character data (research/002-character-data-source).
          EOF
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push
